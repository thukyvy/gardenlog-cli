[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gardenlog"
version = "0.2.0"
description = "A tiny command-line garden care tracker: know when each plant needs water."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Vy" },
]
keywords = ["garden", "plants", "watering", "cli", "tracker"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
gardenlog = "gardenlog.cli:main"

[tool.setuptools]
packages = ["gardenlog"]
